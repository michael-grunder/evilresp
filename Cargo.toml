[package]
name = "evilresp"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
tlsh = { package = "fast-tlsh", version = "0.1" }
hex = "0.4"
libc = "0.2"
rand = "0.10"
rand_chacha = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
