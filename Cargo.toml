[package]
name = "evilresp"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
tlsh = { package = "fast-tlsh", version = "0.1" }
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
